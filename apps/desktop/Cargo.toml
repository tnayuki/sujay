[package]
name = "sujay-app"
version = "0.1.0"
edition = "2021"
description = "Sujay — Rust-native host binary (Phase 5)"
license = "MIT"

[[bin]]
name = "sujay"
path = "src/main.rs"

[dependencies]
# Audio engine (NAPI-free core)
sujay_audio = { path = "../../crates/audio", default-features = false }
# Native UI renderer
sujay_ui = { path = "../../crates/ui" }

# Window / event loop
winit = "0.30"
raw-window-handle = "0.6"

# Settings
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform dirs (userData, music cache)
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info (CPU / memory for titlebar)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[package.metadata.bundle]
name = "Sujay"
identifier = "com.tnayuki.sujay"
short_description = "Sujay AI DJ"
long_description = "Sujay AI DJ application"
category = "public.app-category.music"
