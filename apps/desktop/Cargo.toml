[package]
name = "sujay-app"
version = "0.1.0"
edition = "2021"
description = "Sujay — Rust-native host binary (winit window + egui renderer over sujay-core)"
license = "MIT"

[[bin]]
name = "sujay"
path = "src/main.rs"

[dependencies]
# Host orchestration (engine, decode, library, preferences)
sujay_core = { package = "sujay-core", path = "../../crates/core" }
# Native UI renderer
sujay_decks = { package = "sujay-decks", path = "../../crates/decks" }

# Window / event loop
winit = "0.30"
raw-window-handle = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[package.metadata.bundle]
name = "Sujay"
identifier = "com.tnayuki.sujay"
short_description = "Sujay AI DJ"
long_description = "Sujay AI DJ application"
category = "public.app-category.music"
