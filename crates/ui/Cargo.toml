[package]
name = "sujay_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
gpui-preview = ["dep:gpui"]

[dependencies]
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-graphics = "0.24"
wgpu = { version = "24", default-features = false, features = ["metal", "wgsl"] }
raw-window-handle = "0.6"
pollster = "0.3"
egui = "0.31"
egui-wgpu = "0.31"
gpui = { version = "0.2.2", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
raw-window-handle = "0.6"
pollster = "0.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
