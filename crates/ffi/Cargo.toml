[package]
name = "sujay-ffi"
version = "0.1.0"
edition = "2021"
description = "Sujay — C ABI over sujay-core for the Swift host"
license = "MIT"

[lib]
name = "sujay_ffi"
crate-type = ["staticlib"]

[dependencies]
sujay_core = { package = "sujay-core", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
