[package]
name = "sujay-core"
version = "0.1.0"
edition = "2021"
description = "Sujay — host orchestration (engine, decode, library, preferences); no windowing, no UI"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
sujay_audio = { path = "../audio", default-features = false }
sujay_library = { package = "sujay-library", path = "../library" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform dirs (settings, default recording directory)
dirs = "5"

# System info (CPU / memory for the titlebar)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
