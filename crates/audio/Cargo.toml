
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "sujay_audio"
version = "0.1.0"

[lib]
crate-type = ["rlib"]

[dependencies]
cpal = "0.15"
thiserror = "1"
parking_lot = "0.12"
soundtouch = { version = "0.5", default-features = false }
thread-priority = "1.2"
rustfft = "6.2"
crossbeam-channel = "0.5"
web-audio-api = { version = "1.2", default-features = false, features = ["cpal"] }

# Audio decoding
symphonia = { version = "0.5", features = ["mp3"] }

# Vorbis OGG encoding (writer)
vorbis_rs = "0.5"

# Audio encoding
hound = "3.5"
tracing = "0.1"
