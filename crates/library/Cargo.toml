[package]
name = "sujay-library"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
diesel = { version = "2.3.9", default-features = false, features = ["sqlite"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rbox = { version = "=0.1.5", default-features = false, features = ["master-db", "anlz", "bundled-vendored-openssl"] }